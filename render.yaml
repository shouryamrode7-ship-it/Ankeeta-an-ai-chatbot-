# Render Blueprint – https://render.com/docs/blueprint-spec
# Free plan: the service sleeps when idle and SQLite memory resets on restart.
# For persistent memory either set REDIS_URL, or switch to `plan: starter` and add a disk:
#   disk: { name: ankeeta-data, mountPath: /data, sizeGB: 1 }
services:
  - type: web
    name: ankeeta
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: LLM_TIMEOUT_MS
        value: "60000"
      - key: LLM_API_KEY
        sync: false
