# Render Blueprint – https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ankeeta
    runtime: docker
    plan: starter            # persistent disks need a paid plan; see README for the free + Redis option
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: ankeeta-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/ankeeta.db
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_VERIFY_TOKEN
        generateValue: true
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: WHATSAPP_ALLOWED_NUMBERS
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: ADMIN_API_KEY
        generateValue: true
