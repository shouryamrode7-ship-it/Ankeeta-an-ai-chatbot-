<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Chat with Ankeeta</title>
  <meta name="theme-color" content="#1a110d" />
  <script src="/enter.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="chat pending">
  <div class="ambient chat-ambient" aria-hidden="true"></div>
  <div class="app">
    <header class="chat-nav">
      <div class="nav-in">
        <a class="brand" href="/" aria-label="Ankeeta home"><span class="logo" aria-hidden="true">A</span>Ankeeta</a>
        <span class="status" data-status role="status"><i aria-hidden="true"></i><span>Checking…</span></span>
        <div class="actions-r">
          <button type="button" class="btn btn-quiet" id="new-chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            New chat
          </button>
          <span class="sep" aria-hidden="true"></span>
          <a class="btn btn-quiet" href="/">Home</a>
        </div>
      </div>
    </header>

    <main class="convo" id="convo">
      <div class="convo-in">
        <section class="welcome" id="welcome" aria-labelledby="welcome-title">
          <span class="logo" aria-hidden="true">A</span>
          <h1 id="welcome-title">Hey, I’m Ankeeta.</h1>
          <p class="welcome-sub">Your space to think, explore and discover.</p>
          <p class="welcome-note">Ask a question, test an idea or simply start talking. I’ll keep up with the conversation.</p>
          <div class="prompts">
            <button type="button" class="prompt" data-prompt="Help me brainstorm an idea.">
              <span class="prompt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span>
              <span><strong>Brainstorm an idea</strong><small>Turn a rough thought into something concrete.</small></span>
            </button>
            <button type="button" class="prompt" data-prompt="Explain something interesting.">
              <span class="prompt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
              <span><strong>Explore a topic</strong><small>Learn something new and interesting.</small></span>
            </button>
            <button type="button" class="prompt" data-prompt="Recommend something to watch.">
              <span class="prompt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
              <span><strong>Find something to watch</strong><small>Get a recommendation for tonight.</small></span>
            </button>
            <button type="button" class="prompt" data-prompt="Let’s have a random conversation.">
              <span class="prompt-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-3.9A8 8 0 1 1 20 12z"/></svg></span>
              <span><strong>Just talk</strong><small>A relaxed, open-ended conversation.</small></span>
            </button>
          </div>
        </section>
        <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
      </div>
    </main>

    <div class="composer-wrap">
      <form id="chat-form" class="composer" autocomplete="off">
        <textarea id="msg" rows="1" maxlength="1000" placeholder="Ask me anything..." aria-label="Message Ankeeta" enterkeyhint="send"></textarea>
        <button type="submit" id="send" class="send" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="foot"><span>Ankeeta is an AI. Please don’t share passwords or other sensitive info.</span><span class="hint">Enter to send · Shift + Enter for a new line</span></p>
    </div>
  </div>
  <script src="/status.js"></script>
  <script type="module" src="/chat.js"></script>
</body>
</html>
