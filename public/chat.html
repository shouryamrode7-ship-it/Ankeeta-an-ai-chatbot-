<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat with Ankeeta</title>
  <meta name="theme-color" content="#000000" />
  <script src="/enter.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/springy-text.css" />
</head>
<body class="chat pending">
  <div class="chat-wrap">
    <header class="chat-head">
      <span class="status"><i aria-hidden="true"></i>Online</span>
      <a class="home" href="/">Home</a>
      <span class="avatar" aria-hidden="true">A</span>
    </header>

    <main class="stage">
      <section class="hero-c" aria-label="Welcome">
        <span class="hero-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-3.9A8 8 0 1 1 20 12z"/><path d="M9 11.5h.01M12 11.5h.01M15 11.5h.01" stroke-width="2.4"/></svg>
        </span>
        <p class="hero-1">Heyy ✨</p>
        <h1 class="hero-2">How’s your day going?</h1>
      </section>
      <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
    </main>

    <form id="chat-form" class="composer" autocomplete="off">
      <input id="msg" data-springy-text type="text" maxlength="1000" placeholder="Ask me anything ..." aria-label="Your message" required />
      <div id="chips" class="chips" hidden>
        <button type="button" class="chip">Recommend a movie</button>
        <button type="button" class="chip">Tell me a joke</button>
        <button type="button" class="chip">Suggest some music</button>
        <button type="button" class="chip">Cheer me up</button>
      </div>
      <button type="submit" id="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="chat-foot">Ankeeta is an AI. Please don’t share passwords or other sensitive info.</div>
  </div>
  <script src="/springy-text.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
