<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat with Ankeeta</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/springy-text.css" />
</head>
<body class="chat">
  <div class="chat-wrap">
    <header class="chat-head">
      <span class="avatar" aria-hidden="true">A</span>
      <div><strong>Ankeeta</strong><small>AI companion · online</small></div>
      <a class="home" href="/">Home</a>
    </header>

    <main id="log" aria-live="polite" aria-label="Conversation"></main>

    <div id="chips" class="chips" hidden>
      <button type="button" class="chip">Recommend a movie</button>
      <button type="button" class="chip">Tell me a joke</button>
      <button type="button" class="chip">Suggest some music</button>
      <button type="button" class="chip">Cheer me up</button>
    </div>

    <form id="chat-form" autocomplete="off">
      <input id="msg" data-springy-text type="text" maxlength="1000" placeholder="Message Ankeeta" aria-label="Your message" required />
      <button type="submit" id="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="chat-foot">Ankeeta is an AI. Please don’t share passwords or other sensitive info.</div>
  </div>
  <script src="/springy-text.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
